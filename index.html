<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>التيارات الدوامة — الأستاذ باقر أنيس العقابي</title>
<meta name="description" content="تجربة تعليمية تفاعلية عن التيارات الدوامة — الفيزياء، السادس الإعدادي العلمي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-render-blocking: the app must paint immediately with its
     Arabic fallback stack even with no internet access in the classroom;
     the web font upgrades in place once/if it arrives. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* =========================================================================
   BAQER PHYSICS LAB — Eddy Currents Interactive Experience
   Design tokens, motion system, and base styles
   ========================================================================= */
:root{
  --bg-0:#050912;
  --bg-1:#081321;
  --bg-2:#0b1a2b;
  --surface-1:rgba(10,27,43,.66);
  --surface-2:rgba(15,38,58,.78);
  --surface-3:rgba(19,46,68,.88);

  --border-soft:rgba(150,210,255,.14);
  --border-active:rgba(100,215,255,.44);
  --border-strong:rgba(140,220,255,.6);

  --text-primary:#F3F8FC;
  --text-secondary:#A8BAC8;
  --text-muted:#718392;

  --accent:#61D8FF;
  --accent-2:#7CF2C4;
  --accent-warm:#FFB36B;
  --accent-danger:#FF7A6E;
  --accent-heat:#FF9A4D;

  --motion-fast:180ms;
  --motion-standard:320ms;
  --motion-slow:700ms;
  --motion-cinematic:1200ms;

  --ease-ui:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-cinematic:cubic-bezier(.16,1,.3,1);

  --rail-w:76px;
  --header-h:clamp(52px,5.2vh,68px);
  --timeline-h:56px;

  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:8px;

  --fs-title:clamp(40px,6vw,70px);
  --fs-h1:clamp(26px,2.4vw,36px);
  --fs-question:clamp(24px,2vw,32px);
  --fs-answer:clamp(19px,1.5vw,26px);
  --fs-control:clamp(16px,1.1vw,20px);
  --fs-label:clamp(14px,1vw,17px);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg-0);
  color:var(--text-primary);
  font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",sans-serif;
  font-weight:400;
  /* Vertical scroll is a deliberate safety net, not the intended experience:
     on a real 1920x1080 (and down to the ~768px-tall target) everything fits
     with no scrolling. But some interactive-panel browsers report a taller
     viewport than what is actually visible, silently pushing the footer/rail
     bottom/home-scene buttons below the fold with nothing to reach them —
     this guarantees that content is always at least scrollable into view
     rather than permanently unreachable. */
  overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
svg{display:block;overflow:visible;}
::selection{background:rgba(97,216,255,.3);}

.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}
body.reduced-motion .bg-drift, body.reduced-motion .bg-twinkle{animation:none!important;}

/* =========================================================================
   COSMIC BACKGROUND — persistent atmosphere behind the whole app
   ========================================================================= */
#cosmic-bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 90% at 78% 8%, rgba(31,72,110,.35), transparent 60%),
    radial-gradient(90% 70% at 12% 96%, rgba(20,50,80,.30), transparent 65%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 55%, #030509 100%);
}
#cosmic-bg canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.85;}
/* No filter:blur() here — these move continuously (animation below), and an
   animated blur filter must be recomposited every frame, which is expensive
   and flicker-prone on weak/embedded GPUs. The radial-gradient's own
   "transparent 70%" fade already gives a soft haze edge for free. */
.bg-haze{position:absolute;border-radius:50%;opacity:.28;mix-blend-mode:screen;}
.bg-haze.h1{width:46vw;height:46vw;background:radial-gradient(circle,#2c6fa8,transparent 70%);top:-14%;right:-8%;animation:driftA 46s ease-in-out infinite;}
.bg-haze.h2{width:38vw;height:38vw;background:radial-gradient(circle,#1c4e6b,transparent 70%);bottom:-16%;left:-6%;animation:driftB 60s ease-in-out infinite;}
.bg-haze.h3{width:26vw;height:26vw;background:radial-gradient(circle,#3a8fae,transparent 70%);top:38%;left:22%;animation:driftA 70s ease-in-out infinite reverse;}
@keyframes driftA{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-3%,2%) scale(1.05);}}
@keyframes driftB{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(3%,-2%) scale(1.06);}}
#scene-scrim{position:fixed;inset:0;z-index:1;background:rgba(3,6,11,0);transition:background var(--motion-cinematic) var(--ease-cinematic);pointer-events:none;}
body.scene-dim #scene-scrim{background:rgba(3,6,11,.42);}
body.focus-mode #scene-scrim{background:rgba(2,4,8,.72);}

/* =========================================================================
   APP SHELL
   ========================================================================= */
/* Not position:fixed: if this device's browser ever reports a taller viewport
   than what is actually visible, a fixed 100vh box would pin content below
   the fold with no way to reach it. In normal flow with min-height, content
   that needs more room simply pushes the (now-scrollable) body taller. */
#app{position:relative;min-height:100vh;min-height:100dvh;width:100%;z-index:2;display:flex;flex-direction:column;}

/* ---- Header ---- */
header.app-header{
  height:var(--header-h);flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;gap:16px;
  /* Solid gradient instead of backdrop-filter: blurring a bar that sits over a
     continuously-animated background is expensive to recomposite every frame
     and flickers on weak/embedded GPUs (interactive touch panels). A slightly
     more opaque gradient reads just as "glassy" without that cost. */
  background:linear-gradient(180deg, rgba(6,12,22,.94), rgba(6,12,22,.8));
  border-bottom:1px solid var(--border-soft);
  transition:transform var(--motion-standard) var(--ease-ui), opacity var(--motion-standard) var(--ease-ui);
  z-index:20;
}
body.ui-hidden header.app-header{transform:translateY(-120%);opacity:0;pointer-events:none;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{width:30px;height:30px;flex:0 0 auto;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.brand-text b{font-size:15px;font-weight:700;color:var(--text-primary);white-space:nowrap;}
.brand-text span{font-size:11px;color:var(--text-muted);white-space:nowrap;}
.header-crumb{flex:1;display:flex;justify-content:center;min-width:0;}
.crumb-track{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb-track b{color:var(--text-secondary);font-weight:500;}
.crumb-sep{opacity:.5;}
.header-right{display:flex;align-items:center;gap:12px;flex:0 0 auto;}
.unit-badge{
  font-size:13px;color:var(--text-secondary);
  background:var(--surface-1);border:1px solid var(--border-soft);
  padding:5px 12px;border-radius:100px;font-variant-numeric:tabular-nums;
  direction:ltr;unicode-bidi:isolate;
}
.mode-switch{display:flex;background:var(--surface-1);border:1px solid var(--border-soft);border-radius:100px;padding:3px;gap:2px;}
.mode-switch button{padding:6px 14px;border-radius:100px;font-size:12.5px;color:var(--text-muted);transition:all var(--motion-fast) var(--ease-ui);}
.mode-switch button.active{background:var(--accent);color:#03131c;font-weight:600;}
.icon-btn-sm{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-1);border:1px solid var(--border-soft);color:var(--text-secondary);transition:all var(--motion-fast) var(--ease-ui);}
.icon-btn-sm:hover{border-color:var(--border-active);color:var(--text-primary);}
.icon-btn-sm svg{width:17px;height:17px;}

/* ---- Main layout ---- */
/* Track order is [rail-nav, stage, rail-tools] in the DOM; under RTL grid the
   first track renders at the physical right edge, so rail-nav (first) lands on
   the right and rail-tools (last) lands on the left, per spec. */
#main-row{flex:1 1 auto;min-height:0;display:grid;grid-template-columns: var(--rail-w) 1fr var(--rail-w);transition:grid-template-columns var(--motion-standard) var(--ease-ui);position:relative;}
body.nav-collapsed #main-row{grid-template-columns: 0px 1fr var(--rail-w);}
body.tools-collapsed #main-row{grid-template-columns: var(--rail-w) 1fr 0px;}
body.nav-collapsed.tools-collapsed #main-row{grid-template-columns: 0px 1fr 0px;}
body.ui-hidden #main-row{grid-template-columns: 0px 1fr 0px;}

/* ---- Rails ---- */
/* The tools rail alone stacks 14 buttons + 2 dividers. At a fixed 56px each
   that only barely fits an exact 1920x1080 viewport with almost no margin —
   on anything shorter (a touch panel reporting less vertical space, or the
   spec's own 1366x768 support target) it silently overflows below the fold.
   --rail-btn scales the whole rail down smoothly with viewport height so it
   always fits, rather than clipping. */
:root{ --rail-btn: clamp(38px, 6.2vh, 56px); }
.rail{
  /* overflow must stay visible (not hidden): the nav-rail flyout submenus are
     220px wide and deliberately extend past this rail's own --rail-w column —
     clipping here would silently hide them even though they're otherwise
     correctly positioned, opaque, and click-through-able. The rail fades via
     opacity (not a width clip) when collapsed, so nothing needs local clipping.
     z-index is above the header/footer (both 20): a flyout's z-index:30 is
     otherwise trapped inside .rail's own stacking context, which — at the
     rail's old z-index:15 — sat BELOW the header/footer in the outer context.
     A tall flyout overlapping the footer would then have the footer paint on
     top and silently steal its clicks. */
  position:relative;z-index:22;
  display:flex;flex-direction:column;align-items:center;
  /* padding/gap are derived from --rail-btn (not their own independent clamp)
     so the whole rail scales down as one consistent proportion, rather than
     the button and its spacing hitting their size floors at different
     viewport heights and drifting out of sync. */
  padding:calc(var(--rail-btn) * .25) 0;gap:calc(var(--rail-btn) * .143);
  background:linear-gradient(180deg, rgba(7,14,24,.55), rgba(7,14,24,.28));
  transition:opacity var(--motion-standard) var(--ease-ui);
}
.rail.rail-nav{border-inline-end:1px solid var(--border-soft);}
/* Not justify-content:space-between: that pushed the view/tools group triggers
   down toward the bottom of the rail, which then left their downward-opening
   flyouts (5 rows tall) too little room and ran them off the bottom edge. */
.rail.rail-tools{border-inline-start:1px solid var(--border-soft);}
body.nav-collapsed .rail-nav, body.tools-collapsed .rail-tools, body.ui-hidden .rail{opacity:0;pointer-events:none;}
.rail-group{display:flex;flex-direction:column;gap:calc(var(--rail-btn) * .143);align-items:center;}
.rail-spacer{flex:1;}

.rail-btn{
  width:var(--rail-btn);height:var(--rail-btn);border-radius:16px;
  display:grid;place-items:center;position:relative;
  background:var(--surface-1);border:1px solid var(--border-soft);
  color:var(--text-secondary);
  transition:transform var(--motion-fast) var(--ease-spring), border-color var(--motion-fast), background var(--motion-fast), color var(--motion-fast);
}
.rail-btn svg{width:43%;height:43%;pointer-events:none;}
.rail-btn:hover{border-color:var(--border-active);color:var(--text-primary);transform:translateY(-1px);}
.rail-btn:active{transform:scale(.94);}
.rail-btn.active{background:rgba(97,216,255,.16);border-color:var(--border-active);color:var(--accent);}
.rail-btn.on-indicator::after{content:"";position:absolute;inset-inline-end:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2);opacity:0;transition:opacity var(--motion-fast);}
.rail-btn.active.on-indicator::after{opacity:1;}
.rail-btn .rb-label{position:absolute;inset-inline-end:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(6px);white-space:nowrap;background:var(--surface-3);border:1px solid var(--border-soft);padding:6px 12px;border-radius:10px;font-size:13px;color:var(--text-primary);opacity:0;pointer-events:none;transition:opacity var(--motion-fast) var(--ease-ui), transform var(--motion-fast) var(--ease-ui);}
.rail-tools .rail-btn .rb-label{inset-inline-end:auto;inset-inline-start:calc(100% + 10px);}
.rail-btn:hover .rb-label{opacity:1;transform:translateY(-50%) translateX(0);}

/* Buttons grouped inside a flyout (the view/tools sub-menus) render as full
   rows with an always-visible label instead of small icon squares that rely
   on a hover tooltip — hover never fires on touch, so the tooltip pattern
   alone would leave these controls unlabeled on the interactive screen. */
.flyout .rail-btn{display:flex;width:100%;height:auto;min-height:52px;border-radius:11px;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:0 14px;}
.flyout .rail-btn svg{width:20px;height:20px;flex:0 0 auto;}
.flyout .rail-btn .rb-label{position:static;opacity:1;pointer-events:none;transform:none;background:none;border:none;padding:0;font-size:14px;color:inherit;white-space:normal;text-align:start;}
.flyout .rail-btn.on-indicator::after{inset-inline-end:10px;top:50%;transform:translateY(-50%);}

.rail-divider{width:34px;height:1px;background:var(--border-soft);margin:2px 0;}

/* Flyout submenu from nav rail */
.flyout{
  position:absolute;top:0;left:calc(100% + 10px);right:auto;
  display:flex;flex-direction:column;gap:4px;
  background:var(--surface-3);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  padding:10px;min-width:220px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  opacity:0;transform:translateX(10px);pointer-events:none;
  transition:opacity var(--motion-fast) var(--ease-ui), transform var(--motion-fast) var(--ease-ui);
  z-index:30;
}
/* rail-nav is docked at the right edge of the screen; open its flyouts physically to the left, toward the stage */
.rail-nav .flyout{left:auto;right:calc(100% + 10px);}
.flyout.open{opacity:1;transform:translateX(0);pointer-events:auto;}
.flyout-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--text-secondary);transition:background var(--motion-fast);text-align:start;width:100%;}
.flyout-item:hover{background:rgba(97,216,255,.1);color:var(--text-primary);}
.flyout-item.current{color:var(--accent);background:rgba(97,216,255,.08);}
.flyout-item .fi-num{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:18px;}

/* ---- Stage ---- */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;}
.scene{position:absolute;inset:0;opacity:0;transform:scale(1.025);pointer-events:none;transition:opacity var(--motion-cinematic) var(--ease-cinematic), transform var(--motion-cinematic) var(--ease-cinematic);}
.scene.scene-active{opacity:1;transform:scale(1);pointer-events:auto;}

/* ---- Mini timeline / footer ---- */
.footer-bar{
  position:relative;z-index:20;
  flex:0 0 auto;height:var(--timeline-h);display:flex;align-items:center;justify-content:center;gap:14px;
  /* see header.app-header note above: solid gradient instead of backdrop-filter */
  padding:0 24px;background:linear-gradient(0deg, rgba(6,12,22,.92), rgba(6,12,22,.72));
  border-top:1px solid var(--border-soft);
  transition:transform var(--motion-standard) var(--ease-ui), opacity var(--motion-standard) var(--ease-ui);
}
body.ui-hidden .footer-bar{transform:translateY(120%);opacity:0;pointer-events:none;}
.timeline{display:flex;align-items:center;gap:0;}
.tl-node{display:flex;align-items:center;}
.tl-dot{width:15px;height:15px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border-soft);cursor:pointer;position:relative;transition:all var(--motion-fast) var(--ease-spring);flex:0 0 auto;}
.tl-dot:hover{border-color:var(--border-active);transform:scale(1.15);}
.tl-dot.done{background:var(--accent);border-color:var(--accent);}
.tl-dot.current{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px rgba(97,216,255,.18);width:17px;height:17px;}
.tl-dot .tl-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface-3);border:1px solid var(--border-soft);padding:4px 10px;border-radius:8px;font-size:11.5px;opacity:0;pointer-events:none;transition:opacity var(--motion-fast);}
.tl-dot:hover .tl-tip{opacity:1;}
.tl-line{width:22px;height:2px;background:var(--border-soft);}
.tl-line.done{background:var(--accent);}
.footer-label{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:center;direction:ltr;unicode-bidi:isolate;}

/* =========================================================================
   SHARED SCENE COMPONENTS
   ========================================================================= */
.teaching-scene{display:grid;grid-template-columns:1.15fr .85fr;height:100%;}
.scene-visual{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:26px;}
.scene-visual .stage-caption{position:absolute;bottom:18px;inset-inline-start:26px;font-size:12.5px;color:var(--text-muted);background:var(--surface-1);border:1px solid var(--border-soft);padding:6px 12px;border-radius:100px;}
.scene-panel{
  position:relative;min-width:0;min-height:0;
  display:flex;flex-direction:column;
  padding:34px 34px 20px;
  border-inline-start:1px solid var(--border-soft);
  background:linear-gradient(180deg, rgba(8,16,28,.35), rgba(8,16,28,.55));
}
/* Only this inner area scrolls — see the buildTeachingScene() note on why
   the nav buttons live outside it. */
.scene-panel-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;}
.scene-panel-scroll::-webkit-scrollbar{width:6px;}
.scene-panel-scroll::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:10px;}

.module-tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--accent);background:rgba(97,216,255,.1);border:1px solid rgba(97,216,255,.25);padding:5px 12px;border-radius:100px;margin-bottom:14px;}
.scene-h1{font-size:var(--fs-h1);font-weight:700;color:var(--text-primary);margin-bottom:22px;line-height:1.3;}

.qa-block{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border-soft);}
.qa-block:last-of-type{border-bottom:none;}
.qa-question{font-size:var(--fs-question);font-weight:600;color:var(--text-primary);line-height:1.55;margin-bottom:16px;}
.qa-question::before{content:"س";display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:rgba(97,216,255,.15);color:var(--accent);font-size:15px;font-weight:700;margin-inline-end:10px;vertical-align:middle;}
.btn-reveal{
  display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-control);font-weight:600;
  color:#03131c;background:linear-gradient(135deg, var(--accent), #4fb8e6);
  padding:13px 26px;border-radius:14px;min-height:56px;
  box-shadow:0 10px 26px rgba(97,216,255,.22);transition:transform var(--motion-fast) var(--ease-spring), box-shadow var(--motion-fast);
}
.btn-reveal:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(97,216,255,.32);}
.btn-reveal:active{transform:scale(.97);}
.btn-reveal svg{width:19px;height:19px;}
.qa-answer{margin-top:16px;}
.qa-answer[hidden]{display:none;}
.qa-line{
  font-size:var(--fs-answer);color:var(--text-secondary);line-height:1.85;margin-bottom:10px;
  opacity:0;transform:translateY(8px);transition:opacity var(--motion-slow) var(--ease-cinematic), transform var(--motion-slow) var(--ease-cinematic);
}
.qa-line.in{opacity:1;transform:translateY(0);}
.qa-line mark{background:rgba(97,216,255,.16);color:var(--accent);padding:0 4px;border-radius:4px;font-weight:600;box-decoration-break:clone;}
.qa-note{margin-top:14px;font-size:12.5px;color:var(--text-muted);background:var(--surface-1);border:1px dashed var(--border-soft);padding:8px 12px;border-radius:10px;}
.needs-verify{color:var(--accent-warm);font-size:12px;border:1px solid rgba(255,179,107,.4);padding:1px 8px;border-radius:100px;margin-inline-start:6px;white-space:nowrap;}

body.question-mode .btn-reveal{display:none;}
body.question-mode .qa-answer{display:none;}
body.question-mode .qa-hint{display:flex;}
.qa-hint{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);margin-top:10px;}
.qa-hint svg{width:15px;height:15px;}

.lz-stepper{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px;}
.lz-chip{
  font-size:13.5px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--border-soft);
  padding:9px 15px;border-radius:11px;min-height:44px;display:flex;align-items:center;gap:6px;transition:all var(--motion-fast) var(--ease-ui);
}
.lz-chip:hover{border-color:var(--border-active);}
.lz-chip.active{background:rgba(97,216,255,.14);border-color:var(--border-active);color:var(--accent);}
.lz-arrow{color:var(--text-muted);font-size:14px;}
.lz-caption{min-height:20px;font-size:13px;color:var(--accent-2);margin-top:4px;}

.why-btn{position:absolute;top:18px;inset-inline-end:18px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--border-soft);padding:8px 14px;border-radius:100px;z-index:6;transition:all var(--motion-fast);}
.why-btn:hover{border-color:var(--border-active);color:var(--accent);}
.why-popover{
  position:absolute;top:60px;inset-inline-end:18px;max-width:300px;z-index:7;
  background:var(--surface-3);border:1px solid var(--border-active);border-radius:var(--radius-md);
  padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:all var(--motion-fast) var(--ease-ui);
}
.why-popover.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.why-popover b{display:block;color:var(--accent);font-size:12px;margin-bottom:8px;}
.why-popover p{font-size:14px;color:var(--text-secondary);line-height:1.7;}

.module-nav-btns{display:flex;gap:12px;flex:0 0 auto;padding-top:14px;margin-top:8px;border-top:1px solid var(--border-soft);}
.nav-step-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;background:var(--surface-1);border:1px solid var(--border-soft);font-size:var(--fs-control);color:var(--text-secondary);transition:all var(--motion-fast);}
.nav-step-btn:hover{border-color:var(--border-active);color:var(--text-primary);}
.nav-step-btn svg{width:18px;height:18px;}

/* Generic labeled arrow used across visuals */
.field-label{position:absolute;background:var(--surface-3);border:1px solid var(--border-soft);padding:5px 11px;border-radius:9px;font-size:12.5px;color:var(--text-primary);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity var(--motion-standard) var(--ease-ui);display:flex;align-items:center;gap:6px;}
.field-label.show{opacity:1;}
.field-label .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

/* Meters (relative, not measured data) */
.meter-block{margin-top:14px;}
.meter-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.meter-name{font-size:12.5px;color:var(--text-secondary);min-width:88px;}
.meter-track{flex:1;height:10px;border-radius:100px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--border-soft);}
.meter-fill{height:100%;border-radius:100px;transition:width var(--motion-slow) var(--ease-cinematic);}
.meter-fill.heat{background:linear-gradient(90deg,#8a4a1f,var(--accent-heat));}
.meter-fill.current{background:linear-gradient(90deg,#1f6a8a,var(--accent));}
.meter-note{font-size:11px;color:var(--text-muted);margin-top:4px;}

/* =========================================================================
   HOME SCENE
   ========================================================================= */
.home-scene{display:flex;align-items:center;justify-content:center;position:relative;}
.home-stars{position:absolute;inset:0;}
.home-core{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,26px);text-align:center;padding:20px;z-index:2;}
/* capped by vh too (not just vw) so on a short/wide viewport the ring can't
   grow large enough to push the buttons below it out of view */
.home-ring-wrap{width:min(30vw,32vh,340px);height:min(30vw,32vh,340px);position:relative;margin-bottom:6px;animation:homeFloat 9s ease-in-out infinite;}
@keyframes homeFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
.home-ring-wrap svg{width:100%;height:100%;filter:drop-shadow(0 0 30px rgba(97,216,255,.25));}
.home-kicker{font-size:13px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
.home-title{font-size:var(--fs-title);font-weight:700;background:linear-gradient(135deg,#fff,#bfe9ff 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;}
.home-sub{font-size:clamp(16px,1.6vw,22px);color:var(--text-secondary);}
.home-sub b{color:var(--text-primary);font-weight:600;}
.home-course{font-size:14px;color:var(--text-muted);}
.home-actions{display:flex;gap:16px;margin-top:10px;}
.btn-primary-lg{
  min-height:64px;padding:0 34px;border-radius:16px;font-size:19px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),#4fb8e6);color:#03131c;
  display:flex;align-items:center;gap:10px;box-shadow:0 16px 40px rgba(97,216,255,.28);
  transition:transform var(--motion-fast) var(--ease-spring), box-shadow var(--motion-fast);
}
.btn-primary-lg:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(97,216,255,.4);}
.btn-secondary-lg{
  min-height:64px;padding:0 30px;border-radius:16px;font-size:17px;font-weight:600;color:var(--text-primary);
  background:var(--surface-1);border:1px solid var(--border-soft);display:flex;align-items:center;gap:10px;
  transition:all var(--motion-fast) var(--ease-ui);
}
.btn-secondary-lg:hover{border-color:var(--border-active);background:var(--surface-2);}
.home-fs-hint{position:absolute;bottom:22px;font-size:12px;color:var(--text-muted);display:flex;gap:18px;}
.home-fs-hint span{display:flex;align-items:center;gap:6px;}
.home-fs-hint kbd{background:var(--surface-1);border:1px solid var(--border-soft);padding:2px 7px;border-radius:6px;font-size:11px;}

/* =========================================================================
   OVERVIEW SCENE (استعراض المحتوى)
   ========================================================================= */
.overview-scene{padding:50px 60px;overflow-y:auto;height:100%;}
.overview-head{margin-bottom:26px;}
.overview-head h2{font-size:var(--fs-h1);font-weight:700;}
.overview-head p{color:var(--text-muted);font-size:14px;margin-top:6px;}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.ov-card{
  background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  padding:18px;min-height:110px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;
  transition:all var(--motion-fast) var(--ease-ui);text-align:start;
}
.ov-card:hover{border-color:var(--border-active);transform:translateY(-3px);background:var(--surface-2);}
.ov-num{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;}
.ov-title{font-size:15.5px;font-weight:600;color:var(--text-primary);line-height:1.5;}

/* =========================================================================
   FOCUS / ANNOTATION / LASER
   ========================================================================= */
body.focus-mode .rail,body.focus-mode header.app-header,body.focus-mode .footer-bar,body.focus-mode .scene-panel,body.focus-mode .why-btn{opacity:0!important;pointer-events:none!important;}
.focus-exit-hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;font-size:13px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border-soft);padding:8px 16px;border-radius:100px;opacity:0;transition:opacity var(--motion-standard);pointer-events:none;}
body.focus-mode .focus-exit-hint{opacity:1;}

/* z-index is local to #app's stacking context here (not the body-level one):
   10 sits above the plain stage (auto/~0) but below the header (20), rails (15)
   and footer (20) — so those, and the annotate toggle button inside them, stay
   reachable at all times even while annotate mode is active. */
/* touch-action:none is essential here: without it, a touchscreen's browser
   treats a drawing drag as a pan/scroll gesture and only delivers sparse,
   cancelled pointermove events — the stroke comes out as disconnected dots
   instead of a continuous line. A mouse never triggers that gesture
   recognizer at all, which is why this only showed up on the touch panel. */
#annotate-canvas{position:fixed;inset:0;z-index:10;pointer-events:none;display:none;touch-action:none;}
body.annotate-active #annotate-canvas{display:block;pointer-events:auto;cursor:crosshair;}
.annotate-toolbar{position:fixed;bottom:calc(var(--timeline-h) + 18px);left:50%;transform:translateX(-50%) translateY(20px);z-index:25;display:flex;gap:8px;background:var(--surface-3);border:1px solid var(--border-active);padding:8px;border-radius:16px;opacity:0;pointer-events:none;transition:all var(--motion-standard) var(--ease-spring);box-shadow:0 20px 50px rgba(0,0,0,.5);}
body.annotate-active .annotate-toolbar{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.annotate-toolbar button{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--text-secondary);background:transparent;}
.annotate-toolbar button.active{background:rgba(97,216,255,.18);color:var(--accent);}
.annotate-toolbar button svg{width:20px;height:20px;}
.annotate-toolbar .a-sep{width:1px;background:var(--border-soft);margin:6px 2px;}
.annotate-color{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.5);cursor:pointer;}

#laser-dot{position:fixed;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,rgba(255,110,90,.95),rgba(255,110,90,0) 70%);box-shadow:0 0 24px 8px rgba(255,110,90,.55);pointer-events:none;z-index:70;display:none;transform:translate(-50%,-50%);}
body.laser-active #laser-dot{display:block;}
body.laser-active{cursor:none;}

/* =========================================================================
   LOADING SCREEN
   ========================================================================= */
#loading{position:fixed;inset:0;z-index:200;background:var(--bg-0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity var(--motion-cinematic) var(--ease-cinematic);}
#loading.hide{opacity:0;pointer-events:none;}
.load-logo{font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--text-primary);}
.load-logo span{color:var(--accent);}
.load-sub{font-size:13.5px;color:var(--text-muted);}
.load-bar{width:220px;height:3px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden;}
.load-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s var(--ease-ui);}

/* =========================================================================
   RESPONSIVE
   ========================================================================= */
@media (max-width:1200px){
  .teaching-scene{grid-template-columns:1fr;grid-template-rows:1fr auto;}
  .scene-panel{border-inline-start:none;border-top:1px solid var(--border-soft);max-height:46%;}
}
@media (max-aspect-ratio: 4/3){
  :root{--rail-w:64px;}
}
</style>
</head>
<body>

<div id="app">

  <div id="main-row">

    <main id="stage" aria-live="polite"></main>

    <nav class="rail rail-tools" aria-label="أدوات الشرح">
      <div class="rail-group">
        <button class="rail-btn" id="tool-replay" title="إعادة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20a9 9 0 1 0-3-16l-3 3"/></svg><span class="rb-label">إعادة</span></button>

          </div>

            <button class="rail-btn on-indicator" id="tool-annotate" title="أداة الرسم"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l4-1 12-12-3-3L4 17l-1 4z"/></svg><span class="rb-label">الرسم على الشاشة</span></button>
            <button class="rail-btn on-indicator" id="tool-laser" title="المؤشر الضوئي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8"/></svg><span class="rb-label">المؤشر الضوئي</span></button>

  <div class="footer-bar">

  <!-- Kept inside #app (not at body level) so the annotate canvas sits BELOW the
       header/rails/footer in the stacking order: it can still draw over the whole
       stage, but never covers the very controls (incl. its own toggle button)

/* =========================================================================
   SMALL HELPERS
   ========================================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}, parent=null){
  const el = document.createElementNS(SVGNS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(el);
  return el;
}
function el(tag, cls, parent=null){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(parent) parent.appendChild(e);
  return e;
}
function mark(text){
  // convert **term** to <mark>term</mark> without altering visible characters
  return text.replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}

/* =========================================================================
   GLOBAL ANIMATION ENGINE (single rAF loop; transform/opacity driven)
   ========================================================================= */
// A scene that has been visited stays built (cached) in the DOM for instant
// re-entry, but its particles/ticks must not keep consuming CPU — or keep
// integrating physics with a stale, ever-growing frame budget — once the
// teacher has navigated away. Every particle/tick is gated on its owning
// .scene actually being the active one.
function ownerSceneOf(elOrNode){
  return elOrNode && elOrNode.closest ? elOrNode.closest('.scene') : null;
}
function guardTick(rootEl, fn){
  return (now, dt) => {
    const scene = ownerSceneOf(rootEl);
    if(scene && !scene.classList.contains('scene-active')) return;
    fn(dt);
  };
}
const animEngine = {
  particles:[],
  ticks:[],
  lastTime:0,
  addParticle(p){ p.t = p.t ?? Math.random(); this.particles.push(p); return p; },
  removeAll(list){ if(!list) return; for(const p of list) { const i=this.particles.indexOf(p); if(i>=0) this.particles.splice(i,1);} },
  frame(now){
    if(!animEngine.lastTime) animEngine.lastTime = now;
    let dt = (now - animEngine.lastTime)/1000;
    animEngine.lastTime = now;
    dt = Math.min(dt, 0.05);
    if(!document.hidden){
      const speed = state.paused ? 0 : state.animationSpeed;
      for(const p of animEngine.particles){
        if(!p.active) continue;
        if(p.sceneEl===undefined) p.sceneEl = ownerSceneOf(p.path);
        if(p.sceneEl && !p.sceneEl.classList.contains('scene-active')) continue;
        if(!p.pathLen) p.pathLen = p.path.getTotalLength();
        p.t = (p.t + dt*speed*(p.rate||SIM.fieldParticleRate)*(p.dir||1));
        if(p.t>1) p.t -= 1; if(p.t<0) p.t += 1;
        const pt = p.path.getPointAtLength(p.t*p.pathLen);
        p.dot.setAttribute('cx', pt.x.toFixed(2));
        p.dot.setAttribute('cy', pt.y.toFixed(2));
      }
      for(const cb of animEngine.ticks) cb(now, dt*speed);
    }
    requestAnimationFrame(animEngine.frame);
  }
};
requestAnimationFrame(animEngine.frame);

/* =========================================================================
   STARFIELD (static draw — cheap, no per-frame cost)
   ========================================================================= */
(function starfield(){
  const c = document.getElementById('starfield');
  const ctx = c.getContext('2d');
  function draw(){
    const w = c.width = c.offsetWidth * devicePixelRatio;
    const h = c.height = c.offsetHeight * devicePixelRatio;
    ctx.clearRect(0,0,w,h);
    const n = Math.floor((w*h)/38000);
    for(let i=0;i<n;i++){
      const x = Math.random()*w, y = Math.random()*h;
      const r = Math.random()*1.4+.2;
      const o = Math.random()*.6+.15;
      ctx.beginPath();
      ctx.fillStyle = `rgba(200,225,255,${o})`;
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
  }
  draw();
  window.addEventListener('resize', ()=>{ clearTimeout(window.__sfR); window.__sfR=setTimeout(draw,200); });
})();

/* =========================================================================
   SCENE MANAGER
   ========================================================================= */
const SceneManager = {
  scenes:new Map(),
  current:null,
  stage:null,
  init(stage){ this.stage = stage; },
  register(scene){ this.scenes.set(scene.id, scene); },
  go(id, opts={}){
    const next = this.scenes.get(id);
    if(!next) return;
    if(this.current === next && !opts.force) return;
    // Build the target scene BEFORE tearing down the current one, and never let a
    // single scene's bug blank the whole app — fall back to staying put (graceful
    // degradation per the error-handling requirement).
    if(!next.built){
      try{
        next.el = el('div','scene', this.stage);
        next.el.dataset.id = id;
        next.build(next.el);
        next.built = true;
      }catch(err){
        console.error('[BAQER PHYSICS LAB] failed to build scene "'+id+'":', err);
        next.el?.remove();
        next.built = false;
        return;
      }
    }
    if(this.current){
      this.current.pause?.();
      this.current.el.classList.remove('scene-active');
      this.current.exit?.();
    }
    requestAnimationFrame(()=>{
      next.el.classList.add('scene-active');
    });
    try{ next.enter?.(); }catch(err){ console.error('[BAQER PHYSICS LAB] scene "'+id+'" enter() failed:', err); }
    this.current = next;
    state.scene = id;
    onSceneChanged(next);
  }
};

/* =========================================================================
   MAGNETIC FIELD + EDDY CURRENT ENGINE (reusable across scenes)
   Uses SVG for vector paths (field lines, loops, arrows) and lightweight
   rAF-driven particles traveling along those paths.
   ========================================================================= */
function buildFieldLines(svg, group, {x0,x1,y0,y1,count=5, dir=1}){
  const g = svgEl('g',{class:'field-lines'}, group);
  const particles=[];
  for(let i=0;i<count;i++){
    const x = lerp(x0,x1, (i+.5)/count);
    const d = `M ${x} ${y0} L ${x} ${y1}`;
    const path = svgEl('path',{d, stroke:'rgba(120,200,255,.35)','stroke-width':1.6,fill:'none','stroke-dasharray':'2 7','stroke-linecap':'round'}, g);
    const dot = svgEl('circle',{r:3.4, fill:'#61D8FF', opacity:.9}, g);
    const p = animEngine.addParticle({path, dot, rate:SIM.fieldParticleRate, dir, active:true, t:i/count});
    particles.push(p);
  }
  return {g, particles};
}
function buildEddyLoops(svg, group, {cx,cy,baseR=46,count=3,dir=1,gap=16,color='#7CF2C4'}){
  const g = svgEl('g',{class:'eddy-loops'}, group);
  const particles=[];
  const paths=[];
  for(let i=0;i<count;i++){
    const rx = baseR - i*gap*.5;
    const ry = rx*.62;
    const path = svgEl('ellipse',{cx,cy,rx:Math.max(rx,10),ry:Math.max(ry,7),fill:'none',stroke:color,'stroke-width':1.8,opacity:(1-i*0.22).toFixed(2)}, g);
    paths.push(path);
    // ellipse doesn't support getPointAtLength directly in all browsers reliably via <ellipse>; use a path 'd' equivalent
    const d = ellipseToPath(cx,cy,Math.max(rx,10),Math.max(ry,7));
    path.remove();
    const p2 = svgEl('path',{d, fill:'none', stroke:color, 'stroke-width':1.8, opacity:(1-i*0.22).toFixed(2)}, g);
    const dot = svgEl('circle',{r:3.2, fill:color}, g);
    // capture the real animEngine particle (not just {path,dot}) so callers
    // can flip .dir live — e.g. when the conductor's motion reverses, the
    // eddy circulation direction must reverse with it.
    const particle = animEngine.addParticle({path:p2, dot, rate:SIM.eddyParticleRate*(1-i*0.12), dir, active:true, t:i/count});
    particles.push(particle);
  }
  return {g, particles};
}
function ellipseToPath(cx,cy,rx,ry){
  return `M ${cx-rx} ${cy} A ${rx} ${ry} 0 1 0 ${cx+rx} ${cy} A ${rx} ${ry} 0 1 0 ${cx-rx} ${cy} Z`;
}
function setGroupVisible(g, visible){
  if(!g) return;
  g.style.opacity = visible? 1 : 0;
  g.style.transition = `opacity var(--motion-standard) var(--ease-ui)`;
  g.style.pointerEvents = visible? 'auto':'none';
}

/* Lenz-law sequential stepper builder: ΔΦ → EMF → I_eddy → B_ind → F_B */
function buildLenzStepper(container, onStep, labels){
  const steps = labels || ['ΔΦ','EMF','I_eddy','B_ind','F_B'];
  const captions = {
    'ΔΦ':'يتغيّر الفيض المغناطيسي المخترق للموصل.',
    'EMF':'يتولّد قوة دافعة كهربائية محتثة وفق قانون فاراداي.',
    'I_eddy':'تسري تيارات دوامة في مسارات مغلقة داخل المعدن.',
    'B_ind':'تولّد هذه التيارات مجالًا مغناطيسيًا محتثًا خاصًا بها.',
    'F_B':'ينشأ عن ذلك قوة تعاكس سبب التغيّر وفق قانون لنز.'
  };
  const wrap = el('div','lz-stepper', container);
  const caption = el('div','lz-caption', container);
  const chips=[];
  steps.forEach((s,i)=>{
    if(i>0) el('span','lz-arrow', wrap).textContent='←';
    const chip = el('button','lz-chip', wrap); chip.textContent = s;
    chip.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      caption.textContent = captions[s]||'';
      onStep && onStep(s,i);
    });
    chips.push(chip);
  });
  return {chips, caption, activate:(i)=> chips[i]?.click()};
}

  const state_p = { angA:0.55, angB:0.55, vA:0, vB:0, running:false, t:0, ghostA:0.55, ghostB:0.55, traceOn:false, stepMode:false };
  const L = SIM.pendulumLength, g0 = SIM.pendulumGravity;

  function fieldDamping(ang, isSolid){

    return (isSolid? SIM.dampingSolid : SIM.dampingSlotted) * proximity;

    // sub-step the explicit-Euler integration (mirrors the pendulum scene) so a
    // large dt (e.g. after the tab was backgrounded) can't destabilize the spring
    const sub = 4, sdt = clamp(dt,0,0.05)/sub;
    for(let i=0;i<sub;i++){
      const acc = -0.02*angle;
      vel += acc*sdt*60;
      const damp = fieldOn ? 0.045 : 0.0015;
      vel *= (1-damp);
      angle += vel*sdt*60*0.05;
    }
    if(!Number.isFinite(angle) || !Number.isFinite(vel)){ angle = 0.5; vel = 0; }
    angle = clamp(angle, -2, 2);
    armG.setAttribute('transform', `rotate(${angle*40} 180 60)`);
    const speedMag = Math.abs(vel);
    eddyG.style.opacity = (state.showCurrents && fieldOn) ? clamp(speedMag*6,.15,1).toFixed(2) : 0;
    vArrow.style.display = state.showLabels && speedMag>0.001 ? '':'none';
    vArrow.setAttribute('x2', 180 + Math.sign(vel||1)*40);
    fArrow.style.display = state.showForces && fieldOn ? '':'none';
    fArrow.setAttribute('x2', 180 - Math.sign(vel||1)*40);
  }
  animEngine.ticks.push(guardTick(root, frame));

  const controls = el('div', null, root);
  controls.style.cssText='display:flex;gap:12px;align-items:center;';
  const toggleWrap = el('div', null, controls);
  toggleWrap.style.cssText='display:flex;align-items:center;gap:10px;background:var(--surface-1);border:1px solid var(--border-soft);padding:8px 16px;border-radius:100px;';
  toggleWrap.innerHTML = `<span style="font-size:13px;color:var(--text-secondary);">المجال</span>`;
  const fToggle = el('button', null, toggleWrap);
  fToggle.style.cssText='min-width:64px;min-height:40px;border-radius:100px;background:rgba(97,216,255,.18);border:1px solid var(--border-active);color:var(--accent);font-size:13px;font-weight:600;';
  fToggle.textContent='ON';
  fToggle.addEventListener('click', ()=>{
    fieldOn = !fieldOn;
    fToggle.textContent = fieldOn?'ON':'OFF';
    fToggle.style.background = fieldOn? 'rgba(97,216,255,.18)':'rgba(255,255,255,.05)';
    fToggle.style.color = fieldOn? 'var(--accent)':'var(--text-muted)';
  });
  const kickBtn = el('button','btn-secondary-lg', controls);
  kickBtn.style.cssText='min-height:52px;padding:0 20px;font-size:14px;';
  kickBtn.textContent='إزاحة الصفيحة';
  kickBtn.addEventListener('click', ()=>{ angle=0.5; vel=0; });

  return {
    syncToggles(){ setGroupVisible(fieldG, state.showField); },
    reset(){ angle=0.5; vel=0; },
    replay(){ angle=0.5; vel=0; },
  };
}

/* ---- M10/M11: Train braking bay ---- */
function visualTrain(root, mod){
  root.style.cssText='position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;';
  const wrap = el('div', null, root); wrap.style.cssText='width:min(56vw,700px);position:relative;';
  const svg = svgEl('svg',{viewBox:'0 0 640 260', style:'width:100%;height:auto;'}, wrap);

  svgEl('rect',{x:0,y:200,width:640,height:8,fill:'#2a3038'}, svg);
  for(let i=0;i<16;i++) svgEl('rect',{x:i*42,y:196,width:22,height:16,fill:'#3a4048'}, svg);

  const trainG = svgEl('g',{}, svg);
  svgEl('rect',{x:0,y:120,width:220,height:70,rx:14,fill:'#3b4a5a',stroke:'#61D8FF','stroke-width':1.4}, trainG);
  svgEl('rect',{x:10,y:132,width:50,height:26,rx:4,fill:'#0e1826'}, trainG);
  svgEl('rect',{x:70,y:132,width:50,height:26,rx:4,fill:'#0e1826'}, trainG);
  svgEl('rect',{x:130,y:132,width:50,height:26,rx:4,fill:'#0e1826'}, trainG);
  function makeWheel(cx,cy){
    const g = svgEl('g',{}, trainG);
    svgEl('circle',{cx,cy,r:15,fill:'#1a2028',stroke:'#5a6a78','stroke-width':3}, g);
    svgEl('line',{x1:cx,y1:cy-11,x2:cx,y2:cy+11,stroke:'#5a6a78','stroke-width':2}, g);
    svgEl('line',{x1:cx-11,y1:cy,x2:cx+11,y2:cy,stroke:'#5a6a78','stroke-width':2}, g);
    return g;
  }
  const wheel1 = makeWheel(40,198);
  const wheel2 = makeWheel(180,198);

  // electromagnet coil near wheel2
  const coilG = svgEl('g',{}, svg);
  for(let i=0;i<4;i++) svgEl('ellipse',{cx:180+i*6-9,cy:198,rx:6,ry:20,fill:'none',stroke:'#61D8FF','stroke-width':1.4,opacity:.7}, coilG);
  coilG.style.opacity=0;

  const eddyG = svgEl('g',{}, svg);
  buildEddyLoops(svg, eddyG, {cx:180,cy:198,baseR:26,count:2,dir:1,color:'#7cf2c4'});
  eddyG.style.opacity=0;

  const fArrow = svgEl('line',{x1:180,y1:198,x2:150,y2:198,stroke:'#FF7A6E','stroke-width':3,opacity:0}, svg);

  let trainX = 0, speed=1.6, braking=false, wheelRot=0;
  function frame(dt){
    if(braking) speed *= Math.pow(SIM.trainDecel, dt*60);
    trainX += speed*dt*60;
    if(!braking && trainX>560) trainX = 0;
    trainX = clamp(trainX, 0, 560);
    trainG.setAttribute('transform', `translate(${trainX},0)`);
    wheelRot = (wheelRot + speed*dt*160) % 360;
    wheel1.setAttribute('transform', `rotate(${wheelRot} 40 198)`);
    wheel2.setAttribute('transform', `rotate(${wheelRot} 180 198)`);
    coilG.style.opacity = braking? 1:0;
    eddyG.style.opacity = (braking && state.showCurrents) ? clamp(speed/1.6,.15,1).toFixed(2) : 0;
    eddyG.setAttribute('transform', `translate(${trainX},0)`);
    fArrow.style.opacity = (braking && state.showForces)?1:0;
    fArrow.setAttribute('x1', 180+trainX); fArrow.setAttribute('x2', 180+trainX-30*clamp(speed,0.2,1));
  }
  animEngine.ticks.push(guardTick(root, frame));

  const controls = el('div', null, root);
  controls.style.cssText='display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;';
  const brakeBtn = el('button','btn-primary-lg', controls);
  brakeBtn.style.cssText='min-height:56px;padding:0 26px;font-size:16px;';
  brakeBtn.innerHTML='<span>تفعيل المكابح</span>';
  const resetBtn2 = el('button','btn-secondary-lg', controls);
  resetBtn2.style.cssText='min-height:56px;padding:0 22px;font-size:14px;';
  resetBtn2.textContent='إعادة الضبط';
  brakeBtn.addEventListener('click', ()=>{ braking = true; });
  resetBtn2.addEventListener('click', ()=>{ braking=false; speed=1.6; trainX=0; });

  const timelineWrap = el('div', null, root);
  timelineWrap.style.cssText='display:flex;gap:26px;font-size:12.5px;color:var(--text-muted);';
  timelineWrap.innerHTML = `<span>قبل: <b style="color:var(--text-secondary)">مكابح متوقفة — لا مجال، لا تيارات دوامة</b></span><span>بعد: <b style="color:var(--accent-2)">مكابح فعّالة — مجال قوي وتيارات دوامة كابحة</b></span>`;

  return {
    syncToggles(){},
    reset(){ braking=false; speed=1.6; trainX=0; },
    replay(){ braking=false; speed=1.6; trainX=0; },
  };
}

  svgEl('text',{x:210,y:100,'text-anchor':'middle',fill:'var(--text-secondary)','font-size':12}, svg).textContent='ملف الإرسال / الاستقبال';

  const groundG = svgEl('g',{}, svg);
  svgEl('rect',{x:20,y:190,width:380,height:120,fill:'#1a2418',opacity:.9}, groundG);
  for(let i=0;i<10;i++) svgEl('line',{x1:20+i*40,y1:190,x2:20+i*40-14,y2:310,stroke:'#243421','stroke-width':1}, groundG);

  const wavesG = svgEl('g',{}, svg);
  const waves=[];
  for(let i=0;i<3;i++){
    const w = svgEl('ellipse',{cx:210,cy:170,rx:40+i*22,ry:16+i*7,fill:'none',stroke:'#61D8FF','stroke-width':1.4,opacity:.5-i*0.12}, wavesG);
    waves.push(w);
  }

  const object = svgEl('g',{cursor:'grab'}, svg);
  const objShape = svgEl('circle',{cx:210,cy:250,r:12,fill:'#d9895a',stroke:'#f0a870','stroke-width':2}, object);
  const objEddy = svgEl('g',{}, object);
  buildEddyLoops(svg, objEddy, {cx:210,cy:250,baseR:16,count:1,dir:1,color:'#7cf2c4'});

  let objY = 250, dragging=false;
  function updateSignal(){
    const dist = clamp(objY-170, 30, 170);
    const strength = clamp(1 - (dist-30)/140, 0.02, 1);
    meterFill.style.width = Math.round(strength*100)+'%';
    objEddy.style.opacity = state.showCurrents ? strength.toFixed(2):0;
    wavesG.style.opacity = state.showField? 1:0;
  }
  object.addEventListener('pointerdown', e=>{ dragging=true; object.setPointerCapture(e.pointerId); });
  object.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const r = svg.getBoundingClientRect();
    const scale=340/r.height;
    objY = clamp((e.clientY-r.top)*scale, 180, 310);
    object.setAttribute('transform', `translate(0,${objY-250})`);
    updateSignal();
  });
  object.addEventListener('pointerup', ()=> dragging=false);

  const xray = el('button', null, root);
  xray.className='btn-secondary-lg';
  xray.style.cssText='min-height:52px;padding:0 20px;font-size:14px;';
  xray.textContent='عرض داخلي (Cutaway)';
  let cut=false;
  xray.addEventListener('click', ()=>{ cut=!cut; groundG.style.opacity = cut? .35:.9; xray.style.color = cut? 'var(--accent)':'var(--text-primary)'; });

  const meterWrap = el('div', null, root);
  meterWrap.style.cssText='width:min(44vw,480px);';
  const label = el('div', null, meterWrap); label.textContent='قوة الإشارة (نسبية)'; label.style.cssText='font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;';
  const track = el('div','meter-track', meterWrap); track.style.height='14px';
  var meterFill = el('div','meter-fill current', track);
  const note = el('div','meter-note', meterWrap); note.textContent='اسحب الجسم المعدني رأسيًا لتغيير المسافة عن الملف — القيم تمثيلية فقط.';
  updateSignal();

  return { syncToggles(){ updateSignal(); }, reset(){ objY=250; object.setAttribute('transform',''); updateSignal(); }, replay(){} };
}

      const x = 350+Math.cos(rad)*190, y = 230+Math.sin(rad)*190;
      svgEl('line',{x1:350+Math.cos(rad)*72,y1:230+Math.sin(rad)*72,x2:x,y2:y,stroke:'var(--border-soft)','stroke-width':2}, svg);
      const g = svgEl('g',{style:'cursor:pointer'}, svg);
      const c = svgEl('circle',{cx:x,cy:y,r:44,fill:'var(--surface-2)',stroke:'var(--border-soft)','stroke-width':2}, g);
      const t = svgEl('text',{x,y:y+5,'text-anchor':'middle',fill:'var(--text-primary)','font-size':14,'font-weight':600}, g); t.textContent=b.t;
      g.addEventListener('mouseenter', ()=>{ c.setAttribute('stroke','var(--border-active)'); c.setAttribute('r',48);});
      g.addEventListener('mouseleave', ()=>{ c.setAttribute('stroke','var(--border-soft)'); c.setAttribute('r',44);});
      g.addEventListener('click', ()=> SceneManager.go(b.id));
    });
    const quizBtn = el('button','btn-primary-lg', container);
    quizBtn.innerHTML = '<span>ابدأ تدريبًا إضافيًا</span>';
    quizBtn.addEventListener('click', ()=> SceneManager.go('quiz'));
  },
});

/* =========================================================================
   QUIZ SCENE ("تدريب إضافي" — clearly separate from ministry questions)
   ========================================================================= */
const QUIZ = [
  {q:'ما اتجاه المجال المغناطيسي المحتث الناتج عن التيارات الدوامة وفقًا لقانون لنز؟', options:['بنفس اتجاه المجال المسبب','معاكس لاتجاه المجال المسبب','عمودي دائمًا على المجال المسبب'], correct:1},
  {q:'لماذا يُصنع قلب المحول من صفائح معزولة بدل قطعة واحدة؟', options:['لتقليل الوزن فقط','لزيادة المقاومة الكهربائية وتقليل التيارات الدوامة','لتحسين المظهر'], correct:1},
  {q:'الصفيحة المقطعة (أسنان المشط) تهتز مقارنة بالصفيحة الكاملة:', options:['بنفس المدة تمامًا','لمدة أطول لأن التيارات فيها أصغر','لا تهتز إطلاقًا'], correct:1},
  {q:'مكابح القطارات الحديثة التي تستثمر التيارات الدوامة تعمل عبر:', options:['احتكاك ميكانيكي مباشر فقط','مجال مغناطيسي يولّد تيارات دوامة معرقلة للحركة','تبريد العجلات'], correct:1},
  {q:'كاشف المعادن يكتشف الجسم المعدني من خلال:', options:['وزن الجسم','تيارات دوامة تُحدث تغيّرًا في الإشارة المستقبَلة','لون الجسم'], correct:1},
];
SceneManager.register({
  id:'quiz', title:'تدريب إضافي', el:null, built:false,
  build(container){
    container.style.cssText='display:flex;align-items:center;justify-content:center;padding:30px;';
    const card = el('div', null, container);
    card.style.cssText='width:min(50vw,640px);background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:36px;';
    const badge = el('div','module-tag', card); badge.textContent='تدريب إضافي — ليس من أسئلة الملزمة الوزارية';
    const qHost = el('div', null, card);
    const nav = el('div', null, card); nav.style.cssText='display:flex;justify-content:space-between;margin-top:22px;align-items:center;';
    const progress = el('span', null, nav); progress.style.cssText='font-size:13px;color:var(--text-muted);';
    const nextBtn = el('button','btn-primary-lg', nav); nextBtn.style.cssText='min-height:52px;padding:0 26px;font-size:15px;'; nextBtn.textContent='التالي';

    let qi=0, score=0, answered=false;
    function renderQ(){
      answered=false;
      qHost.innerHTML='';
      if(qi>=QUIZ.length){
        qHost.innerHTML = `<h2 class="scene-h1">النتيجة: ${score} / ${QUIZ.length}</h2><p style="color:var(--text-secondary);font-size:16px;">أحسنت! يمكنك إعادة التدريب أو العودة إلى الملخص.</p>`;
        nextBtn.textContent='إعادة التدريب';
        progress.textContent='';
        nextBtn.onclick = ()=>{ qi=0; score=0; renderQ(); };
        return;
      }
      const item = QUIZ[qi];
      const qEl = el('div','qa-question', qHost); qEl.textContent = item.q; qEl.style.marginBottom='18px';
      item.options.forEach((opt,oi)=>{
        const b = el('button', null, qHost);
        b.textContent = opt;
        b.style.cssText='display:block;width:100%;text-align:start;padding:14px 18px;margin-bottom:10px;min-height:56px;border-radius:12px;background:var(--surface-1);border:1px solid var(--border-soft);color:var(--text-secondary);font-size:15px;transition:all .2s;';
        b.addEventListener('click', ()=>{
          if(answered) return; answered=true;
          const correct = oi===item.correct;
          if(correct) score++;
          b.style.borderColor = correct? 'var(--accent-2)':'var(--accent-danger)';
          b.style.color = correct? 'var(--accent-2)':'var(--accent-danger)';
          if(!correct){ const rightBtn = qHost.querySelectorAll('button')[item.correct]; rightBtn.style.borderColor='var(--accent-2)'; rightBtn.style.color='var(--accent-2)'; }
        });
        qHost.appendChild(b);
      });
      progress.textContent = `${qi+1} / ${QUIZ.length}`;
      nextBtn.textContent = qi===QUIZ.length-1 ? 'إنهاء':'التالي';
      nextBtn.onclick = ()=>{ qi++; renderQ(); };
    }
    renderQ();
  },
});

}

/* =========================================================================
   ANNOTATION LAYER
   ========================================================================= */
(function annotate(){
  const canvas = document.getElementById('annotate-canvas');
  const ctx = canvas.getContext('2d');
  let drawing=false, tool='pen', color='#61D8FF', lastX=0, lastY=0;
  function resize(){
    const img = ctx.getImageData ? null : null;
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  function pos(e){
    const t = e.touches? e.touches[0]:e;
    return {x:t.clientX, y:t.clientY};
  }
  canvas.addEventListener('pointerdown', e=>{
    drawing=true; const p = pos(e); lastX=p.x; lastY=p.y;
    // capture so a fast stroke can't shed pointer events onto neighboring
    // elements mid-drag (another source of a broken-up, dotted line)
    canvas.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.strokeStyle = tool==='eraser' ? 'rgba(0,0,0,1)' : color;
    ctx.globalCompositeOperation = tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.lineWidth = tool==='eraser' ? 26 : 4;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y;
  });
  canvas.addEventListener('pointerup', e=>{ drawing=false; canvas.releasePointerCapture?.(e.pointerId); });
  canvas.addEventListener('pointercancel', ()=> drawing=false);
  window.addEventListener('pointerup', ()=> drawing=false); // fallback if capture isn't supported

  const toolBtn = document.getElementById('tool-annotate');
  toolBtn.addEventListener('click', ()=>{
    const on = document.body.classList.toggle('annotate-active');
    toolBtn.classList.toggle('active', on);
  });
  document.getElementById('an-pen').addEventListener('click', function(){ tool='pen'; this.classList.add('active'); document.getElementById('an-eraser').classList.remove('active'); });
  document.getElementById('an-eraser').addEventListener('click', function(){ tool='eraser'; this.classList.add('active'); document.getElementById('an-pen').classList.remove('active'); });
  document.querySelectorAll('.annotate-color').forEach(sw=> sw.addEventListener('click', ()=>{ color = sw.dataset.color; }));
  document.getElementById('an-clear').addEventListener('click', ()=> ctx.clearRect(0,0,canvas.width,canvas.height));
  document.getElementById('an-close').addEventListener('click', ()=>{
    document.body.classList.remove('annotate-active');
    toolBtn.classList.remove('active');
  });
})();

(function laser(){
  const dot = document.getElementById('laser-dot');
  const btn = document.getElementById('tool-laser');
  btn.addEventListener('click', ()=>{

/* =========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================= */
window.addEventListener('keydown', (e)=>{
  if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  const idx = CONTENT.findIndex(m=>m.id===state.scene);
  switch(e.key){
    case 'ArrowRight': case ' ':
      e.preventDefault();
      if(idx>=0 && idx<CONTENT.length-1) SceneManager.go(CONTENT[idx+1].id);
      else if(state.scene==='home') SceneManager.go('m1');
      break;
    case 'ArrowLeft':
      if(idx>0) SceneManager.go(CONTENT[idx-1].id);
      break;
    case 'f': case 'F': fsBtn.click(); break;
    case 'h': case 'H': hideBtn.click(); break;
    case 'r': case 'R': document.getElementById('tool-reset').click(); break;
    case 'p': case 'P': pauseBtnEl.click(); break;
    case 's': case 'S': setTeacherMode(false); break;
    case 't': case 'T': setTeacherMode(true); break;
    case 'Escape': if(state.focusMode) setFocusMode(false); break;
  }
});

/* =========================================================================
   TOUCH SWIPE (horizontal)
   ========================================================================= */
(function swipe(){
  let sx=0, sy=0;
  document.getElementById('stage').addEventListener('touchstart', e=>{
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  document.getElementById('stage').addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
    const idx = CONTENT.findIndex(m=>m.id===state.scene);
    if(idx<0) return;
    if(dx < 0 && idx < CONTENT.length-1) SceneManager.go(CONTENT[idx+1].id); // RTL: swipe left = next
    if(dx > 0 && idx > 0) SceneManager.go(CONTENT[idx-1].id);
  }, {passive:true});
})();

/* =========================================================================
   SCENE-DIM (darken cosmic background while in a teaching scene)
   ========================================================================= */
const _origGo = SceneManager.go.bind(SceneManager);
SceneManager.go = function(id, opts){
  _origGo(id, opts);
  document.body.classList.toggle('scene-dim', id !== 'home');
};

/* =========================================================================
   BOOT
   ========================================================================= */
function boot(){
  SceneManager.init(document.getElementById('stage'));
  buildTimeline();
  buildFlyouts();
  SceneManager.go('home', {force:true});

  // simulate brief asset/init progress for the loading screen
  const fill = document.getElementById('load-fill');
  let p = 0;
  const iv = setInterval(()=>{
    p += Math.random()*22+10;
    fill.style.width = Math.min(p,100)+'%';
    if(p>=100){
      clearInterval(iv);
      setTimeout(()=>{
        document.getElementById('loading').classList.add('hide');
      }, 220);
    }
  }, 140);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
